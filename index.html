  function renderDownloads(){const filtered=systems.filter(s=>activeDownload==='Todos'||s.platform===activeDownload);$('#page-content').innerHTML=heading('Meus Downloads','Um lugar para encontrar os sistemas e aplicativos do seu ecossistema.')+`<div class="toolbar"><div class="tabs" aria-label="Filtrar por plataforma">${['Todos','Windows','Android','iOS'].map(t=>`<button class="tab ${activeDownload===t?'active':''}" data-action="download-filter" data-id="${t}" aria-pressed="${activeDownload===t}">${t}</button>`).join('')}</div><small class="muted">${filtered.length} ${filtered.length===1?'opção':'opções'} no catálogo</small></div><div class="download-grid">${filtered.map(s=>`<article class="download-card"><div class="row between" style="width:100%"><span class="system-logo">${icon(s.icon)}</span><span class="tag">${s.platform}</span></div><span class="eyebrow" style="font-size:9px;margin-bottom:0">${s.type}</span><h3>${s.name}</h3><p>${s.description}</p><div class="download-meta">${s.platform==='iOS'?'Disponibilidade a confirmar':'Instalador oficial ainda não vinculado'}</div><button class="btn outline" data-action="download" data-id="${s.id}">${icon('download')} Consultar disponibilidade</button></article>`).join('')}</div><div class="info-box">${icon('info')}<div><strong>Preparado para seus arquivos oficiais.</strong><br>Os instaladores e links das lojas serão vinculados pela CPUSIS. Nenhum arquivo de instalação é distribuído nesta demonstração.</div></div>`;}
  function renderFinance(){$('#page-content').innerHTML=heading('Financeiro','Acompanhe um exemplo de mensalidade e explore o fluxo de consulta.',`<button class="btn outline small" data-action="export-invoices">${icon('download')} Exportar CSV</button>`)+`<div class="finance-grid"><section class="panel"><div class="panel-title"><h3>Mensalidade de exemplo</h3><span class="tag amber">Em aberto</span></div><div class="panel-body"><small class="muted">NOVEMBRO / 2026 · DADOS FICTÍCIOS</small><div class="bill-total">${money(149.9)}</div><div class="bill-label">Vencimento ilustrativo: 10 de novembro de 2026</div><div class="bill-actions"><button class="btn gold" data-action="pix">${icon('pix')} Pagar com PIX (demo)</button><button class="btn outline" data-action="invoice" data-id="DEMO-003">${icon('file')} Gerar 2ª via (demo)</button></div></div></section><section class="panel"><div class="panel-title"><h3>Sobre esta demonstração</h3>${icon('shield')}</div><div class="panel-body"><p style="font-size:12px">Os valores, vencimentos e status desta área são exemplos de como as informações poderão ser organizadas.</p><ul class="feature-list" style="margin-bottom:0"><li>${icon('check')} Nenhuma cobrança é emitida</li><li>${icon('check')} Nenhum pagamento é processado</li><li>${icon('check')} Integração financeira em etapa posterior</li></ul></div></section></div><section class="panel"><div class="panel-title"><h3>Histórico de faturas</h3><span class="tag">Dados de exemplo</span></div><div class="table-scroll"><table class="data-table"><caption class="hidden">Faturas ilustrativas, sem validade para pagamento</caption><thead><tr><th>Referência</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Detalhes</th></tr></thead><tbody>${invoices.map(i=>`<tr><td><strong>${i.month}</strong><br><small class="muted">${i.id}</small></td><td>${i.date}</td><td>${money(i.amount)}</td><td><span class="tag ${i.status==='Pago'?'green':'amber'}">${i.status}</span></td><td><button class="link-btn"   function renderSupport(){const ts=state.tickets.filter(t=>ticketFilter==='Todos'||t.status===ticketFilter);$('#page-content').innerHTML=heading('Suporte Técnico','Um caminho mais simples para organizar suas solicitações.',`<button class="btn gold small" data-action="new-ticket">${icon('plus')} Abrir chamado</button>`)+`<div class="support-grid"><section class="panel"><div class="panel-title"><h3>Meus chamados locais</h3><span class="tag">${state.tickets.length} registros</span></div><div style="padding:16px 20px 0" class="tabs">${['Todos','Aberto','Encerrado'].map(t=>`<button class="tab ${ticketFilter===t?'active':''}" data-action="ticket-filter" data-id="${t}" aria-pressed="${ticketFilter===t}">${t}</button>`).join('')}</div><div style="padding-top:12px">${ts.length?ts.slice().reverse().map(t=>`<article class="ticket">${icon('headphones')}<div class="system-info"><h4>${esc(t.subject)}</h4><p>${esc(t.description)}</p><small>${esc(t.system)} · ${prettyDate(t.created)} · Prioridade ${esc(t.priority)}</small><div class="row" style="margin-top:12px"><span class="tag ${t.status==='Aberto'?'amber':'green'}">${esc(t.status)}</span>${t.status==='Aberto'?`<button class="link-btn" style="font-size:10px" data-action="close-ticket" data-id="${esc(t.id)}">Encerrar registro</button>`:''}</div></div></article>`).join(''):`<div class="empty">${icon('headphones')}<h3>${state.tickets.length?'Nenhum chamado neste filtro.':'Vamos organizar suas dúvidas?'}</h3><p>${state.tickets.length?'Selecione outro status para consultar seus registros.':'Crie um chamado de teste para conhecer o fluxo de atendimento.'}</p><button class="btn outline small" data-action="new-ticket">${icon('plus')} Criar registro de teste</button></div>`}</div></section><div class="stack"><section class="panel"><div class="panel-title"><h3>Respostas rápidas</h3>${icon('book')}</div><div class="panel-body" style="padding-top:5px"><details class="faq"><summary>Como acessar a demonstração?</summary><p>Use cliente.demo e cpusis123 na tela de login ou escolha Conhecer a demonstração. Nenhuma conta real é criada.</p></details><details class="faq"><summary>Onde estão os instaladores?</summary><p>A área Meus Downloads organiza os sistemas por plataforma. Os links oficiais serão configurados em uma etapa posterior.</p></details><details class="faq"><summary>Meu chamado foi enviado?</summary><p>Ainda não. Este ambiente mantém registros apenas neste navegador. A conexão com a equipe será feita posteriormente.</p></details><details class="faq"><summary>Posso pagar a fatura exibida?</summary><p>Não. Os dados são fictícios e nenhum pagamento é processado. O PIX e o boleto são demonstrações.</p></details></div></section><div class="info-box" style="margin:0">${icon('info')}<div><strong>Registros para experimentar.</strong><br>Os chamados desta etapa não são enviados à equipe CPUSIS. Não inclua informações sensíveis.</div></div></div></div>`;}
  function renderTraining(){$('#page-content').innerHTML=heading('Treinamentos','Conhecimento para avançar, uma etapa por vez.')+`<div class="course-grid">${courses.map(c=>{const n=getProgress(c),percent=Math.round(n/c.lessons.length*100);return `<article class="course"><div class="course-art">${icon(c.icon)}<span>CPUSIS<br>APRENDA & AVANCE</span></div><div class="course-body"><span class="eyebrow" style="font-size:9px;margin-bottom:8px">${c.label}</span><h3>${c.title}</h3><p>${c.description}</p><div class="row between"><small class="muted">${c.lessons.length} etapas · Guia interativo</small>${n===c.lessons.length?'<span class="tag green">Concluído</span>':''}</div><div class="progress"><span style="width:${percent}%"></span></div><small class="muted">${n} de ${c.lessons.length} etapas concluídas</small><button class="btn ${n===c.lessons.length?'outline':'gold'}" data-action="course" data-id="${c.id}">${n===c.lessons.length?'Rever guia':n?'Continuar guia':'Começar guia'} ${icon('arrow')}</button></div></article>`}).join('')}</div><div class="info-box">${icon('book')}<div><strong>Aprendizado dentro do Hub.</strong><br>Os guias interativos já estão disponíveis. Os vídeos oficiais de treinamento serão adicionados quando os materiais forem fornecidos.</div></div>`;}
  function renderTeam(){const tasks=[['systems','Conhecer os sistemas do ecossistema'],['profile','Personalizar meu perfil no Hub'],['training','Concluir o guia de primeiros passos'],['support','Explorar a central de suporte']];$('#page-content').innerHTML=heading('Área do Colaborador','Organize seus primeiros passos e mantenha suas anotações por perto.')+`<div class="workspace-grid"><section class="panel"><div class="panel-title"><h3>Minha lista de primeiros passos</h3><span class="tag">Pessoal</span></div><div class="panel-body">${tasks.map(([id,label])=>`<label class="task"><input type="checkbox" data-task="${id}" ${state.tasks[id]?'checked':''}><span>${label}</span></label>`).join('')}</div></section><section class="panel"><div class="panel-title"><h3>Meu bloco de notas</h3>${icon('file')}</div><form class="panel-body" id="notes-form"><label class="hidden" for="notes">Anotações pessoais</label><textarea id="notes" class="notes-area" name="notes" maxlength="10000" placeholder="Uma ideia, um lembrete ou o próximo passo...">${esc(state.notes)}</textarea><div class="row between" style="margin-top:14px"><small class="muted">Anotações locais</small><button type="submit" class="btn gold small">Salvar anotações ${icon('check')}</button></div></form></section></div><div class="info-box">${icon('info')}<div><strong>Seu espaço de organização.</strong><br>A lista e as notas ficam somente neste navegador. O compartilhamento entre colaboradores poderá ser conectado na próxima etapa.</div></div>`;}
  function renderSettings(){const tabs=[['profile','Meu perfil'],['appearance','Aparência'],['notifications','Notificações'],['data','Dados locais']];$('#page-content').innerHTML=heading('Configurações','Pequenos ajustes para deixar o Hub do seu jeito.')+`<div class="settings-grid"><nav class="settings-tabs" aria-label="Seções de configurações">${tabs.map(([id,name])=>`<button class="tab ${settingsTab===id?'active':''}" style="text-align:left" data-action="settings-tab" data-id="${id}" aria-pressed="${settingsTab===id}">${name}</button>`).join('')}</nav><section class="panel"><div class="panel-title"><h3>${tabs.find(t=>t[0]===settingsTab)[1]}</h3>${icon('settings')}</div><div class="panel-body settings-form">${settingsTab==='profile'?`<form id="profile-form"><div class="form-grid"><div class="field"><label for="profile-name">Seu nome</label><input id="profile-name" name="name" value="${esc(state.profile.name)}" maxlength="80" required></div><div class="field"><label for="profile-company">Empresa</label><input id="profile-company" name="company" value="${esc(state.profile.company)}" maxlength="100" required></div><div class="field"><label for="profile-email">E-mail</label><input id="profile-email" type="email" name="email" value="${esc(state.profile.email)}" maxlength="120" placeholder="Exemplo: cliente@empresa.com"></div><div class="field"><label for="profile-phone">Telefone</label><input id="profile-phone" type="tel" name="phone" value="${esc(state.profile.phone)}" maxlength="30" placeholder="Seu telefone (opcional)"></div></div><p style="font-size:11px">Estes dados personalizam sua demonstração neste navegador. Não criam uma conta de acesso.</p><button class="btn gold small" type="submit">Salvar perfil ${icon('check')}</button></form>`:settingsTab==='appearance'?`<div class="setting-row"><div><strong>Tema do ecossistema</strong><p>${theme==='light'?'Claro, com espaço para o que importa.':'Escuro, para acompanhar seu ritmo.'}</p></div><button class="btn outline small" data-action="theme">${icon(theme==='light'?'moon':'sun')} Usar tema ${theme==='light'?'escuro':'claro'}</button></div>`:settingsTab==='notifications'?`<div class="setting-row"><div><strong>Avisos no Hub</strong><p>Mostrar o indicador dos avisos de demonstração no topo.</p></div><input class="switch" type="checkbox" role="switch" aria-label="Ativar avisos no Hub" id="notifications-switch" ${state.notifications?'checked':''}></div><p style="font-size:11px;margin-top:18px">Nesta etapa, os avisos são exibidos apenas dentro do Hub. Não são enviadas notificações por e-mail ou pelo dispositivo.</p>`:`<p style="font-size:12px">Perfil, chamados, guias, lista e anotações são armazenados localmente. Você pode exportar uma cópia ou apagar os registros de teste.</p><div class="stack" style="gap:12px"><button class="btn outline small" data-action="export-data">${icon('download')} Exportar meus dados locais</button><button class="btn outline small" data-action="reset">Limpar dados de demonstração</button></div>`}</div></section></div>`;}
  function openModal(title,body){lastFocus=document.activeElement;modal.innerHTML=`<div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="Fechar janela">${icon('close')}</button></div><div class="modal-body">${body}</div>`;if(!modal.open)modal.showModal()}
  function closeModal(){modal.close();if(lastFocus?.isConnected)lastFocus.focus()}
  modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
  function showDownload(id){const s=systems.find(s=>s.id===id);if(!s)return;openModal(s.name,`<span class="tag">${s.platform}</span><h3 style="margin-top:20px">${s.platform==='iOS'?'Disponibilidade a confirmar.':'O instalador oficial será vinculado aqui.'}</h3><p>O catálogo já está organizado para ${s.platform}. A CPUSIS ainda precisa adicionar ${s.platform==='iOS'?'o link oficial da loja':'o arquivo de instalação e a versão oficial'}.</p><div class="info-box">${icon('info')}<span>Esta demonstração não baixa arquivos de instalação fictícios.</span></div><div class="modal-actions"><button class="btn outline" data-action="close-modal">Entendi</button><button class="btn gold" data-action="request-download" data-id="${s.id}">Criar registro de interesse ${icon('arrow')}</button></div>`)}
  function showTicket(prefill=''){openModal('Novo chamado de demonstração',`<p>Crie um registro local para conhecer o fluxo. Ele não será enviado à equipe CPUSIS.</p><form id="ticket-form"><div class="form-grid"><div class="field"><label for="ticket-system">Sistema / área</label><select id="ticket-system" name="system"><option>CPUSIS Hub</option>${systems.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div class="field"><label for="ticket-priority">Prioridade</label><select id="ticket-priority" name="priority"><option>Normal</option><option>Alta</option></select></div></div><div class="field"><label for="ticket-subject">Assunto</label><input id="ticket-subject" name="subject" maxlength="120" required value="${esc(prefill)}" placeholder="O que você precisa resolver?"></div><div class="field"><label for="ticket-description">Descrição</label><textarea id="ticket-description" name="description" minlength="10" maxlength="3000" required placeholder="Descreva a situação em pelo menos 10 caracteres. Não inclua senhas ou dados sensíveis."></textarea></div><p class="error hidden" id="ticket-error" role="alert"></p><div class="modal-actions"><button type="button" class="btn outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn gold">Salvar registro local ${icon('check')}</button></div></form>`)}
  function showPix(){let cells='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const inFinder=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(!inFinder&&((x*13+y*7+x*y)%5<2))cells+=`<rect x="${x*7+4}" y="${y*7+4}" width="7" height="7"/>`}for(const [x,y]of [[4,4],[102,4],[4,102]])cells+=`<rect x="${x}" y="${y}" width="49" height="49"/><rect x="${x+7}" y="${y+7}" width="35" height="35" fill="white"/><rect x="${x+14}" y="${y+14}" width="21" height="21"/>`;openModal('PIX · Simulação de pagamento',`<div class="row between"><span class="tag amber">SEM VALIDADE PARA PAGAMENTO</span><strong>${money(149.9)}</strong></div><p style="margin-top:18px">Exemplo de como o pagamento será apresentado quando o serviço financeiro estiver integrado.</p><div class="qr-wrap"><svg viewBox="0 0 155 155" role="img" aria-label="Desenho ilustrativo de código, não pagável"><rect width="155" height="155" fill="white"/><g fill="#0a192f">${cells}</g><rect x="0" y="60" width="155" height="36" fill="white"/><text x="77.5" y="82" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#0a192f">DEMO</text></svg><span>ILUSTRATIVO · NÃO PAGÁVEL</span></div><div class="code-input"><input id="pix-code" value="DEMONSTRACAO-CPUSIS-SEM-VALIDADE-PARA-PAGAMENTO" readonly aria-label="Texto demonstrativo sem validade para pagamento"><button class="btn outline small" data-action="copy-demo">${icon('copy')} Copiar</button></div><div class="info-box">${icon('info')}<span>Nenhuma transação será realizada. O código é apenas um texto de exemplo.</span></div>`)}
  function showInvoice(id){const i=invoices.find(i=>i.id===id);if(!i)return;openModal('Fatura de demonstração',`<span class="tag amber">SEM VALIDADE FISCAL OU PARA PAGAMENTO</span><h3 style="margin-top:22px">${i.month}</h3><div class="stat-value">${money(i.amount)}</div><p>Referência: ${i.id}<br>Empresa: ${esc(state.profile.company)}<br>Vencimento ilustrativo: ${i.date}<br>Status de exemplo: ${i.status}</p><p>Esta visualização apresenta dados fictícios. A emissão de boletos será conectada ao serviço financeiro posteriormente.</p><div class="modal-actions"><button class="btn outline" data-action="close-modal">Fechar</button><button class="btn gold" data-action="print-invoice" data-id="${id}">${icon('file')} Imprimir demonstração</button></div>`)}

  function closeSidebar(){const sidebar=$('#sidebar'),wasOpen=sidebar?.classList.contains('open');sidebar?.classList.remove('open');$('.drawer-backdrop')?.classList.remove('open');$('[data-action="sidebar"]')?.setAttribute('aria-expanded','false');syncSidebar();if(wasOpen)$('[data-action="sidebar"]')?.focus()}
  function showSearch(query){const q=query.trim().toLocaleLowerCase('pt-BR');const results=menus.filter(m=>m[2].toLocaleLowerCase('pt-BR').includes(q));const ss=systems.filter(s=>(s.name+' '+s.description+' '+s.platform).toLocaleLowerCase('pt-BR').includes(q));const cs=courses.filter(c=>(c.title+' '+c.description).toLocaleLowerCase('pt-BR').includes(q));openModal('Busca no Hub',`<p>Resultados para “${esc(query.trim())}”</p>${results.map(m=>`<a class="system-row" href="#hub/${m[0]}" data-action="close-modal">${icon(m[1])}<span class="system-info"><strong>${m[2]}</strong><small>Área do Hub</small></span>${icon('chevron')}</a>`).join('')}${ss.map(s=>`<button class="nav-item" style="color:var(--text)" data-action="download" data-id="${s.id}">${icon(s.icon)}${s.name} · ${s.platform}</button>`).join('')}${cs.map(c=>`<button class="nav-item" style="color:var(--text)" data-action="course" data-id="${c.id}">${icon('book')}${c.title}</button>`).join('')}${!results.length&&!ss.length&&!cs.length?'<div class="empty"><h3>Nenhum resultado encontrado.</h3><p>Tente buscar por financeiro, suporte, ERP ou treinamentos.</p></div>':''}`)}
  document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();const main=$('#main-content');main?.setAttribute('tabindex','-1');main?.focus();return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;switch(action){
    case 'theme':toggleTheme();break;
    case 'public-menu':{const open=$('#public-nav').classList.toggle('open');b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'Fechar menu':'Abrir menu');break}
    case 'sidebar':$('#sidebar').classList.add('open');syncSidebar();$('.drawer-backdrop').classList.add('open');b.setAttribute('aria-expanded','true');$('#sidebar .nav-item')?.focus();break;
    case 'close-sidebar':closeSidebar();break;
    case 'password':{const input=$('#login-password'),show=input.type==='password';input.type=show?'text':'password';b.innerHTML=icon(show?'eye-off':'eye');b.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');b.setAttribute('aria-pressed',String(show));break}
    case 'demo':startDemo();break;
    case 'demo-training':startDemo('training');break;
    case 'demo-support':startDemo('support');break;
    case 'forgot':openModal('Recuperação de acesso',`<p>Este Hub está em demonstração e ainda não possui contas ou envio de e-mail para redefinição de senha.</p><div class="demo-notice"><strong>Acesso para explorar</strong>Usuário: <b>cliente.demo</b><br>Senha: <b>cpusis123</b></div><div class="modal-actions"><button class="btn gold" data-action="close-modal">Voltar ao acesso</button></div>`);break;
    case 'solution':{const s=solutions.find(s=>s.id===id);if(!s)return;openModal(s.name,`<h3>${s.title}</h3><p>${s.description}</p><ul class="feature-list">${s.features.map(f=>`<li>${icon('check')}${f}</li>`).join('')}</ul><p>Explore como essa solução se organiza no ecossistema CPUSIS. As opções exibidas no Hub estão em demonstração.</p><div class="modal-actions"><button class="btn outline" data-action="close-modal">Voltar</button><button class="btn gold" data-action="explore-systems">Explorar sistemas ${icon('arrow')}</button></div>`);break}
    case 'explore-systems':closeModal();startDemo('downloads');break;
    case 'close-modal':closeModal();break;
    case 'download':showDownload(id);break;
    case 'request-download':{const s=systems.find(s=>s.id===id);if(s)showTicket(`Disponibilidade de ${s.name}`);break}
    case 'download-filter':activeDownload=id;renderDownloads();break;
    case 'ticket-filter':ticketFilter=id;renderSupport();break;
    case 'settings-tab':settingsTab=id;renderSettings();break;
    case 'new-ticket':showTicket();break;
    case 'close-ticket':{const t=state.tickets.find(t=>t.id===id);if(t){t.status='Encerrado';const ok=persist();renderSupport();if(ok)toast('Registro local encerrado.')}break}
    case 'pix':showPix();break;
    case 'copy-demo':{const input=$('#pix-code');const text=input.value;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast('Texto de demonstração copiado. Não é um código pagável.')).catch(()=>{input.select();toast('Selecione e copie o texto de demonstração.');});else{input.select();toast('Selecione e copie o texto de demonstração.')}break}
    case 'invoice':showInvoice(id);break;
    case 'print-invoice':{const i=invoices.find(i=>i.id===id);if(!i)break;$('#print-area').innerHTML=`<h1>CPUSIS · DEMONSTRAÇÃO</h1><p>SEM VALIDADE FISCAL OU PARA PAGAMENTO</p><hr><h2>${i.month}</h2><p>${i.id}</p><p>Empresa: ${esc(state.profile.company)}</p><p>Valor ilustrativo: ${money(i.amount)}</p><p>Vencimento ilustrativo: ${i.date}</p><p>Status de exemplo: ${i.status}</p><hr><p>Documento de teste do CPUSIS Hub. Não é boleto ou comprovante de pagamento.</p>`;window.print();break}
    case 'export-invoices':exportFile('CPUSIS_faturas_DEMONSTRACAO.csv','\uFEFFDEMONSTRAÇÃO - SEM VALIDADE PARA PAGAMENTO\r\nReferência;Vencimento;Valor (R$);Status\r\n'+invoices.map(i=>`${i.month};${i.date};${i.amount.toFixed(2).replace('.',',')};${i.status}`).join('\r\n'),'text/csv;charset=utf-8');toast('Histórico de exemplo exportado.');break;
    case 'course':showCourse(id);break;
    case 'lesson-back':showCourse(lessonCourse,Math.max(0,lessonStep-1));break;
    case 'lesson-next':{const c=courses.find(c=>c.id===lessonCourse);state.progress[c.id]=Math.max(getProgress(c),lessonStep+1);const ok=persist();if(lessonStep<c.lessons.length-1)showCourse(c.id,lessonStep+1);else{closeModal();if(location.hash.startsWith('#hub/'))renderPage(routeName());if(ok)toast('Guia concluído! Seu progresso foi salvo.')}break}
    case 'profile':settingsTab='profile';if(location.hash==='#hub/settings')renderSettings();else location.hash='hub/settings';break;
    case 'notifications':openModal('Avisos do ecossistema',`<div class="notification"><strong>Bem-vindo ao CPUSIS Hub.</strong><p>Seu novo ponto de encontro com os sistemas, financeiro e suporte CPUSIS está pronto para explorar.</p></div><div class="notification"><strong>Comece com um guia.</strong><p>A área Treinamentos tem três guias interativos para ajudar nos primeiros passos.</p></div><div class="notification"><strong>Uma etapa de cada vez.</strong><p>Contas reais, arquivos oficiais e cobranças serão conectados posteriormente.</p></div><div class="modal-actions"><button class="btn gold" data-action="mark-read">Marcar avisos como lidos ${icon('check')}</button></div>`);break;
    case 'mark-read':state.read=true;persist();$('.notification-btn')?.classList.remove('unread');$('.notification-btn')?.setAttribute('aria-label','Notificações');closeModal();break;
    case 'export-data':exportFile('CPUSIS_dados_locais.json',JSON.stringify({application:'CPUSIS Hub',mode:'demonstracao',exportedAt:new Date().toISOString(),data:state},null,2),'application/json');toast('Cópia dos dados locais exportada.');break;
    case 'reset':openModal('Limpar dados de demonstração?',`<p>Isso apaga o perfil, os chamados, os guias, a lista e as notas deste navegador. Exporte uma cópia antes, caso queira guardar seus testes.</p><div class="modal-actions"><button class="btn outline" data-action="close-modal">Cancelar</button><button class="btn gold" data-action="confirm-reset">Limpar dados locais</button></div>`);break;
    case 'confirm-reset':{Object.assign(state,JSON.parse(JSON.stringify(defaults)));const ok=persist();closeModal();renderApp('settings');if(ok)toast('Dados de demonstração limpos.');break}
    case 'logout':session=null;try{localStorage.removeItem('cpusis-hub-session');sessionStorage.removeItem('cpusis-hub-session')}catch(e){}location.hash='login';toast('Você saiu da demonstração.');break;
  }});
  document.addEventListener('submit',e=>{const f=e.target;if(f.id==='login-form'){e.preventDefault();const data=new FormData(f);if(String(data.get('user')).trim()!=='cliente.demo'||data.get('password')!=='cpusis123'){$('#login-error').textContent='Use o usuário cliente.demo e a senha cpusis123 para explorar.';$('#login-error').classList.remove('hidden');return}saveSession(data.get('remember')==='on');location.hash='hub/overview'}
    else if(f.id==='ticket-form'){e.preventDefault();const data=new FormData(f),subject=String(data.get('subject')).trim(),description=String(data.get('description')).trim();if(!subject||description.length<10){$('#ticket-error').textContent='Informe um assunto e uma descrição com pelo menos 10 caracteres.';$('#ticket-error').classList.remove('hidden');return}state.tickets.push({id:globalThis.crypto?.randomUUID?.()||`local-${Date.now()}-${Math.random().toString(36).slice(2)}`,subject,description,system:String(data.get('system')),priority:String(data.get('priority')),status:'Aberto',created:new Date().toISOString()});const ok=persist();closeModal();ticketFilter='Todos';if(location.hash==='#hub/support')renderSupport();else location.hash='hub/support';if(ok)toast('Registro salvo neste navegador. Não foi enviado à equipe.');}
    else if(f.id==='profile-form'){e.preventDefault();const data=new FormData(f),name=String(data.get('name')).trim(),company=String(data.get('company')).trim();if(!name||!company){toast('Preencha seu nome e o nome da empresa.');return}state.profile={...state.profile,name,company,email:String(data.get('email')).trim(),phone:String(data.get('phone')).trim()};const ok=persist();renderApp('settings');if(ok)toast('Perfil local atualizado.');}
    else if(f.id==='notes-form'){e.preventDefault();state.notes=String(new FormData(f).get('notes'));if(persist())toast('Anotações salvas neste navegador.');}
    else if(f.id==='global-search'){e.preventDefault();const q=String(new FormData(f).get('q'));if(q.trim())showSearch(q);}
  });
  document.addEventListener('change',e=>{if(e.target.dataset.task){state.tasks[e.target.dataset.task]=e.target.checked;persist()}if(e.target.id==='notifications-switch'){state.notifications=e.target.checked;persist();$('.notification-btn')?.classList.toggle('unread',state.notifications&&!state.read)}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar()});
  let previousRoute='';
  function navigate(){const hash=location.hash.slice(1)||'home';if(modal.open)closeModal();if(hash.startsWith('hub')){if(!session?.demo){location.replace('#login');return}let page=hash.split('/')[1]||'overview';if(!menus.some(m=>m[0]===page)){location.replace('#hub/overview');return}renderApp(page);window.scrollTo(0,0)}else if(hash==='login'){renderLogin();window.scrollTo(0,0)}else{if(!hash.startsWith('home')){location.replace('#home');return}if(!previousRoute.startsWith('home'))renderHome();const section=hash.split('/')[1];if(section){requestAnimationFrame(()=>document.getElementById(section)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}))}else window.scrollTo(0,0);$('#public-nav')?.classList.remove('open');$('[data-action="public-menu"]')?.setAttribute('aria-expanded','false')}previousRoute=hash}
  window.addEventListener('hashchange',navigate);
  navigate();
  </script>
</body>
</html>
